<!DOCTYPE html> 
<html>
    <body>
        <h2>JavaScript Strings Methods</h2>
        <p>Basic Methods</p>
        <script>
            var str = "AmAZiNg";
            document.write(str.toUpperCase());
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>");
            // Test Method -> returns true or false
            var str1= "I learnt About Maths";
            var patt = new RegExp("about");
            document.write(patt.test(str1));
            document.write("res");
        </script>
    </body>
</html>
